<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1600" viewBox="0 0 2000 1600"><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#fbf5ea"/><stop offset="1" stop-color="#eef3e8"/></linearGradient></defs><rect width="2000" height="1600" fill="url(#g)"/><rect x="110" y="100" width="1780" height="1400" rx="44" fill="#fffaf0" stroke="#c8a45d" stroke-width="6"/><circle cx="1660" cy="310" r="150" fill="#8fa58a" opacity=".22"/><circle cx="360" cy="1240" r="180" fill="#c8a45d" opacity=".16"/><text x="180" y="240" font-family="Arial, sans-serif" font-size="40" letter-spacing="8" fill="#8fa58a">HEIRLOOMPLANNERS</text><text x="180" y="390" font-family="Georgia, serif" font-size="92" fill="#314034">How It Works</text><text x="180" y="500" font-family="Arial, sans-serif" font-size="42" fill="#4e5a4f">Simple enough for family hosts, structured enough for busy couples</text><text x="220" y="680" font-family="Arial" font-size="46" fill="#314034">1. Print the workbook pages you need</text><text x="220" y="820" font-family="Arial" font-size="46" fill="#314034">2. Import CSV trackers into Sheets or Notion</text><text x="220" y="960" font-family="Arial" font-size="46" fill="#314034">3. Use prompts for timelines, messages, and vendor questions</text><text x="220" y="1100" font-family="Arial" font-size="46" fill="#314034">4. Share working copies with your planning helpers</text><text x="180" y="1410" font-family="Arial, sans-serif" font-size="34" fill="#6d6a5e">Digital download • Printable + spreadsheets • No physical item shipped</text></svg>